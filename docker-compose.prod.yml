services:
  web:
    build:
      context: .
    image: elections-web:prod
    container_name: elections-web-prod
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-/data/db.sqlite3}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:${APP_PORT:-8000}"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  sqlite_data:
